name: debug
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'docker image to download'
        required: true
        type: string
      target:
        description: 'target file path'
        required: true
        type: string
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
      - name: setup
        run: sudo bash scripts/docker_save.sh
        env:
          MODELSCOPE_TOKEN: ${{ secrets.ModelScope_Token }}
          DOKCER_IMAGE: ${{ inputs.image }}
          DOCKER_TARGET: ${{ inputs.target }}